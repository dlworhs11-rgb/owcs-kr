<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{--bg:#F1EDE5;--panel:#FFFFFF;--line:#E6E6E1;--ink:#0B0B0F;--mute:#55555C;--dim:#6B6B72;--ac:#7D39EB;--ac2:#C6FF33;--red:#D92D20;--chzzk:#00C73C;--soop:#2A6CF6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:repeating-linear-gradient(135deg,rgba(60,45,25,.043) 0 1px,transparent 1px 11px);background-attachment:fixed}   /* same paper as the home page */
a{color:inherit}
.disp{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.01em}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand i{width:28px;height:28px;border-radius:7px;background:#0B0B0F;display:grid;place-items:center}
.brand i:after{content:"";width:9px;height:9px;border-radius:2px;background:var(--ac2)}
.brand span{font-size:26px}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{height:40px;padding:0 14px;border-radius:999px;display:flex;align-items:center;text-decoration:none;font-weight:600;font-size:15px;color:var(--mute);white-space:nowrap}
nav a:hover,nav a.on{background:#F1F1ED;color:#0B0B0F}
.hero{padding:56px 0 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-size:15px;font-weight:700;color:var(--ac)}
h1{font-size:clamp(56px,8vw,96px);line-height:.86;margin:12px 0 0}
.count{display:flex;align-items:center;gap:14px;padding:16px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.count b{font-family:'Barlow Condensed',sans-serif;font-size:56px;line-height:1;color:#0B0B0F}
.count .dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 25%,transparent)}
.count small{display:block;font-size:13px;color:var(--mute)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.seg{display:flex;padding:3px;border-radius:999px;background:#1B1B22;border:1px solid var(--line)}
.seg button{height:36px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--mute);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:#0B0B0F}
.note{font-size:13px;color:var(--dim)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px;padding-bottom:64px}
.team{border-radius:22px;background:#FFFFFF;overflow:hidden;padding-bottom:10px}
.team h2{display:flex;align-items:center;gap:12px;margin:0;padding:16px 18px 12px;font-size:18px}
.team h2 i{width:34px;height:34px;flex:none;background-size:contain;background-position:center;background-repeat:no-repeat}
.team h2 span{margin-left:auto;font-size:13px;font-weight:700;color:var(--mute)}
.team h2 span.on{color:#D92D20}
.rows{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.p{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:#F6F6F3;text-decoration:none}
.p:hover{background:#EFEFEA}
.av{position:relative;width:52px;height:52px;border-radius:50%;background:#EFE9FC center 18%/cover no-repeat;display:grid;place-items:center;font-weight:800;color:#5B22C2}
.p.live .av{box-shadow:0 0 0 3px var(--red)}
.p.live .av:after{content:"LIVE";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);padding:1px 5px;border-radius:4px;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}
.who b{display:block;font-size:16px}
.who small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.go{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.go.chzzk{background:color-mix(in srgb,var(--chzzk) 12%,transparent);color:#00873A}
.go.soop{background:color-mix(in srgb,var(--soop) 12%,transparent);color:#1B4FC4}
.go.none{background:#ECECE8;color:var(--dim)}
.p.off{display:none}
footer{padding:32px 0 56px;background:#0B0B0F;color:#8A8A93;font-size:13px;line-height:1.7}
@media (max-width:720px){.teams{grid-template-columns:minmax(0,1fr)}header nav{display:none}
  /* phone: the live count is a small pill under the title instead of a big card */
  .hero{gap:14px;padding:32px 0 20px}
  .count{flex:none;gap:8px;padding:7px 12px;border-radius:999px}
  .count>div{display:flex;align-items:baseline;gap:5px}
  .count b{font-size:22px}
  .count .dot{width:8px;height:8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent)}
  .count small{display:inline;font-size:12px;white-space:nowrap}}
/* phone / tablet: three teams side by side, each team a column of photo + handle (the whole row opens the stream) */
@media (max-width:899.98px){
  .teams{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .team{border-radius:14px;padding-bottom:6px}
  .team h2{flex-direction:column;gap:4px;padding:10px 6px 8px;font-size:12px;line-height:1.2;text-align:center;word-break:break-word}
  .team h2 i{width:26px;height:26px}
  .team h2 span{margin-left:0;font-size:11px}
  .rows{gap:4px;padding:0 6px}
  .p{grid-template-columns:minmax(0,1fr);justify-items:center;gap:6px;padding:8px 4px 6px;border-radius:10px;text-align:center}
  .av{width:40px;height:40px}
  .who{min-width:0;max-width:100%}
  .who b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who small,.go{display:none}
}
</style>

<main class="wrap">
  <div class="hero">
    <div><div class="eyebrow">선수 개인 방송 · CHZZK / SOOP</div><h1 class="disp">STREAMS</h1></div>
    <div class="count"><span class="dot"></span><div><b id="liveN">0</b><small>지금 방송 중인 선수</small></div></div>

    <div class="note" id="checked"></div>
  </div>

</main>
<footer><div class="wrap">방송 상태는 CHZZK·SOOP에서 몇 분마다 확인해요. 비공식 팬 사이트입니다. Blizzard Entertainment 및 OWCS 공식 운영과 관련이 없습니다.<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:14px"><span style="width:100%;font-size:13px;color:#8A8A93">OWCS 공식 채널</span><a href="https://x.com/OW_Esports_Asia" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0;color:#fff;text-decoration:none;font-size:14px;font-weight:600"><img src="assets/icons/x.png" alt="" style="width:28px;height:28px;border-radius:8px">X</a><a href="https://www.instagram.com/ow_esports_kr/" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0;color:#fff;text-decoration:none;font-size:14px;font-weight:600"><img src="assets/icons/instagram.png" alt="" style="width:28px;height:28px;border-radius:8px">Instagram</a><a href="https://www.sooplive.co.kr/station/owesports" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0;color:#fff;text-decoration:none;font-size:14px;font-weight:600"><img src="assets/icons/soop.png" alt="" style="width:28px;height:28px;border-radius:8px">SOOP 방송국</a></div></div></footer>

<script src="./owcs-dark.js"></script>
<script>
(function () {
  var D = window.OWCS || { teams: [], players: [], standings: [], live: {} };
  // 내 팀 (set on the home page, kept in this browser) is always the first team on every screen size, live or not;
  // phone / tablet: the teams of their calendar subscription come next among the rest
  var mine = [], myTeam = '';
  try { myTeam = localStorage.getItem('owcs-myteam') || ''; } catch (e) {}
  if (window.matchMedia('(max-width:1024px)').matches) {
    try { mine = [localStorage.getItem('owcs-myteam')].concat(JSON.parse(localStorage.getItem('owcs-subteams') || '[]')).filter(function (a, i, l) { return a && l.indexOf(a) === i; }); } catch (e) {}
  }
  function platform(p) {
    var live = (D.live || {})[p.id];
    if (live) return { cls: /chzzk/.test(live) ? 'chzzk' : 'soop', label: /chzzk/.test(live) ? 'CHZZK' : 'SOOP', href: live };   // live shows on the photo ring; the button keeps its platform colour
    var ls = (D.lastStream || {})[p.id] || {};   // both channels: the one with the latest broadcast, SOOP on a tie
    if (p.chzzk && (!p.soop || (ls.chzzk || '') > (ls.soop || ''))) return { cls: 'chzzk', label: 'CHZZK', href: p.chzzk };
    if (p.soop) return { cls: 'soop', label: 'SOOP', href: p.soop };
    return { cls: 'none', label: '채널 없음', href: '' };
  }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render() {
    var L = D.live || {}, n = 0, html = '';
    var order = (D.standings || []).map(function (s) { return s.a; });
    function isLive(p) { return !!L[p.id]; }
    function liveIn(a) { return D.players.filter(function (p) { return p.team === a && isLive(p); }).length; }
    function rank(a) { var i = mine.indexOf(a); return i < 0 ? 100 + order.indexOf(a) : i; }
    // 내 팀 first, then teams with someone live, then the viewer's own teams / standings order; inside a team, live players first
    var teams = (D.teams || []).slice().sort(function (a, b) { return (b.a === myTeam) - (a.a === myTeam) || (liveIn(b.a) ? 1 : 0) - (liveIn(a.a) ? 1 : 0) || rank(a.a) - rank(b.a); });
    teams.forEach(function (t) {
      var ps = D.players.filter(function (p) { return p.team === t.a; });
      ps = ps.filter(isLive).concat(ps.filter(function (p) { return !isLive(p); }));
      var liveCnt = ps.filter(isLive).length; n += liveCnt;
      html += '<section class="team"><h2><i style="background-image:url(\'' + esc(t.logo) + '\')"></i>' + esc(t.n) +
        '<span class="' + (liveCnt ? 'on' : '') + '">' + (liveCnt ? '● 방송 중 ' + liveCnt + '명' : '방송 없음') + '</span></h2><div class="rows">';
      ps.forEach(function (p) {
        var pf = platform(p), live = isLive(p);
        var tag = pf.href ? 'a' : 'div';
        html += '<' + tag + (pf.href ? ' href="' + esc(pf.href) + '" target="_blank" rel="noopener"' : '') + ' class="p' + (live ? ' live' : '') + '">' +
          '<span class="av" style="' + (p.photo ? "background-image:url('" + esc(p.photo) + "')" : '') + '">' + (p.photo ? '' : esc(p.id.slice(0, 2).toUpperCase())) + '</span>' +
          '<span class="who"><b>' + esc(p.id) + '</b><small>' + esc(p.roleFull) + '</small></span>' +
          '<span class="go ' + pf.cls + '">' + esc(pf.label) + (pf.href ? ' ↗' : '') + '</span></' + tag + '>';
      });
      html += '</div></section>';
    });
    document.getElementById('teams').innerHTML = html;
    document.getElementById('liveN').textContent = n;
    var g = (D.liveChecked || D.generated || '').replace('T', ' ').slice(0, 16);
    // warn only when the live check has stalled (no check in 30+ minutes), not every time nobody is live
    var t = Date.parse(D.liveChecked || ''), stale = !(t > 0) || Date.now() - t > 30 * 60000;
    document.getElementById('checked').innerHTML = '<span>마지막 확인 ' + esc(g) + '</span>' +
      (stale ? ' · <span>방송 확인이 30분 넘게 멈춰 있어 실제와 다를 수 있어요</span>' : '');
  }
  render();
  // pick up a rebuilt owcs-data.js without a reload
  setInterval(function () {
    var s = document.createElement('script');
    s.src = 'owcs-data.js?v=' + Date.now();
    s.onload = function () { s.remove(); if (window.OWCS && (window.OWCS.generated !== D.generated || window.OWCS.liveChecked !== D.liveChecked)) { D = window.OWCS; render(); } };
    s.onerror = function () { s.remove(); };
    document.head.appendChild(s);
  }, 60000);
})();
</script>
