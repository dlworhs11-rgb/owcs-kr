name: Keep schedule alive

# GitHub turns off scheduled workflows after 60 days without a commit; one empty commit a month keeps
# the 10-minute live-status refresh (pages.yml) running between seasons.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: monthly commit so scheduled refresh stays on"
          git push
