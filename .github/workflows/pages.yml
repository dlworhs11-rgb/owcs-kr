name: Deploy site

# Builds the whole site here (no PC needed): Liquipedia via the OWCSKR collector (re-read every 30 min, every 10 min
# around today's matches), streams / SOOP VODs every run. Also runs on every push from the PC (live map scores).
# GitHub's own schedule runs late or not at all: most builds are asked for from outside (cron-job.org, matchday-watch.yml,
# the collector's server). Which trigger does what, and what to check when builds stop: README.md, '빌드는 누가 일으키나'.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_lp:
        description: 'Re-read Liquipedia now'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # a deploy that is running finishes; only the newest waiting run is kept (10-22: builds took 5-15 min, so a request every 5 min cancelled each one and nothing deployed for 30 min)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # a push that only changes data/live_scores, live_sets, live_maps, live_cast or live_admin (phone admin page, the PC's live map scores, map names, first heroes, broadcast capture, casters) takes the fast path.
      # The whole push is compared (github.event.before); a push of several commits has no `before` in this shallow copy, so it gets the full build (2026-10-24: only the last commit was looked at)
      - id: kind
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$before^{commit}" 2>/dev/null && [ -z "$(git diff --name-only "$before" HEAD | grep -v -E '^data/(live_scores|live_sets|live_maps|live_cast|live_admin)/')" ]; then echo "fast=--fast" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        with:
          repository: dlworhs11-rgb/OWCSKR
          path: OWCSKR
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Liquipedia copy between runs (raw pages + fetch time), so the collector does not re-read every 10 min.
      # Only the raw wiki (data/lp-cache) and run-lp's status file: data/lp is the collector's committed output, and a cached
      # copy laid over it hid every later collector fix and re-parse (lp2 had to be started fresh by hand on 10-20; P2-07).
      # The active pages' data/lp files are made again on every run from the raw copy (cloud_live.collect), the rest come
      # from the commit. wiki1 (2026-10-24): first key without data/lp
      - uses: actions/cache/restore@v5
        with:
          path: |
            OWCSKR/data/lp-cache
            OWCSKR/data/lp/_status.json
          key: owcskr-wiki1-${{ github.run_id }}
          restore-keys: owcskr-wiki1-
      - id: pages
        uses: actions/configure-pages@v6
      - id: build
        run: python cloud_live.py --out _site --prev "${{ steps.pages.outputs.base_url }}/owcs-data.js" ${{ inputs.force_lp && '--force-lp' || '' }} ${{ steps.kind.outputs.fast }}
      - uses: actions/cache/save@v5
        if: always() && steps.build.outputs.fetched == 'true'
        with:
          path: |
            OWCSKR/data/lp-cache
            OWCSKR/data/lp/_status.json
          key: owcskr-wiki1-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      # the site is deployed either way (the last good data stays up); at FAIL_ALARM (3) failed data builds in a row, and
      # every FAIL_REPEAT (12) runs after that, the run ends red so GitHub mails it once an hour, not every run
      # (cloud_live.stamp_build / build_alarm; the count lives in owcs-data.js)
      - name: Fail the run after repeated data build failures
        if: steps.build.outputs.build_alarm == '1'
        run: |
          echo "::error::data build failed ${{ steps.build.outputs.build_fails }} times in a row; the deployed data is from the last good build (dataBuilt in owcs-ver.json). See the build step's log."
          exit 1
