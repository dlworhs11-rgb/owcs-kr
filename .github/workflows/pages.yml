name: Deploy site

# Builds the whole site here (no PC needed): Liquipedia via the OWCSKR collector (re-read every 30 min, every 10 min
# around today's matches), streams / SOOP VODs every run. Also runs on every push from the PC (live map scores).
# workflow_dispatch can be called from outside (e.g. cron-job.org) when GitHub's own schedule runs late.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_lp:
        description: 'Re-read Liquipedia now'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer push (live score) replaces a deploy still running: no queue

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # a push that only changes data/live_scores (the PC's live map scores) takes the fast path
      - id: kind
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -z "$(git diff --name-only HEAD^ HEAD | grep -v '^data/live_scores/')" ]; then echo "fast=--fast" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: dlworhs11-rgb/OWCSKR
          path: OWCSKR
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Liquipedia copy between runs (pages + fetch time), so the collector does not re-read every 10 min
      - uses: actions/cache/restore@v4
        with:
          path: |
            OWCSKR/data/lp-cache
            OWCSKR/data/lp
          key: owcskr-lp-${{ github.run_id }}
          restore-keys: owcskr-lp-
      - id: pages
        uses: actions/configure-pages@v5
      - id: build
        run: python cloud_live.py --out _site --prev "${{ steps.pages.outputs.base_url }}/owcs-data.js" ${{ inputs.force_lp && '--force-lp' || '' }} ${{ steps.kind.outputs.fast }}
      - uses: actions/cache/save@v4
        if: always() && steps.build.outputs.fetched == 'true'
        with:
          path: |
            OWCSKR/data/lp-cache
            OWCSKR/data/lp
          key: owcskr-lp-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
