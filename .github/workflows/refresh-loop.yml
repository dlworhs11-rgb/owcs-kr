name: Refresh loop

# Keeps the site fresh every 10 minutes without the PC. GitHub runs pages.yml's own '*/10' schedule hours late or
# not at all (10-19: two scheduled runs in a whole day, so streams stayed stale). This job stays up for ~5h40m,
# asks for a site build every 10 minutes (skipped while one is already queued or running, since a new one would
# cancel it), then starts itself again before GitHub's 6-hour job limit. The schedule below only restarts the chain
# if it ever breaks; the concurrency group keeps a single loop (an extra start waits and takes over at the end).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Ask for a site build every 10 minutes
        run: |
          for i in $(seq 1 34); do
            run=$(gh run list -R "$R" -w pages.yml -s in_progress --json databaseId -q length || echo 0)
            wait=$(gh run list -R "$R" -w pages.yml -s queued --json databaseId -q length || echo 0)
            if [ "$((run + wait))" = "0" ]; then
              gh workflow run pages.yml -R "$R" && echo "$(date -u +%H:%M) UTC: build requested" || echo "$(date -u +%H:%M) UTC: request failed"
            else
              echo "$(date -u +%H:%M) UTC: a build is already running"
            fi
            sleep 600
          done
      - name: Start the next loop
        if: ${{ !cancelled() }}   # cancelling a run by hand stops the chain (the schedule restarts it within 3 hours)
        run: gh workflow run refresh-loop.yml -R "$R"
